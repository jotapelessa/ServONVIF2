<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServONVIF TV PRO • Smart TV Leanback Interface</title>
    <meta name="description" content="Interface cinematográfica 10-Foot Leanback (estilo Netflix) para Smart TV e Android TV do sistema de segurança ServONVIF PRO." />
    <!-- 
      NOTE: Google Fonts removed from here to allow offline operation on Android TV.
      Font stack fallback: Inter → system-ui → sans-serif (works offline).
      The CSS @import is handled inside the Tailwind/React bundle via index.css.
    -->
    <style>
      /* Prevent layout shift while fonts load - works offline without blocking */
      :root { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </head>
  <body class="bg-[#070B14] text-slate-100 antialiased overflow-x-hidden selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
