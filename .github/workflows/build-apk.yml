name: Build & Release Android APK (Mobile & TV)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Build Debug APK
      run: |
        cd android
        gradle assembleDebug --no-daemon

    - name: Upload APK to Workflow Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ServONVIF-Android-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.0
        name: "ServONVIF Android TV & Mobile v1.1.0 (APK Oficial)"
        body: |
          ### 🛡️ ServONVIF TV Command Center v1.1.0
          
          Esta versão traz a **Central de Segurança Completa** para Smart TVs:
          
          - 🎛️ **Menu e Navegação por Controle Remoto**: Alternância suave entre Câmeras, Status, Testes e Ajustes.
          - 📊 **Cards de Status em Tempo Real**: Monitoramento de conexão com o Mac, túnel WebSocket e contagem de câmeras.
          - 🧪 **Laboratório de Testes**: Botões interativos para testar Janela PiP (10s), som Chime, Ping de rede e Notificações Heads-Up.
          - 🚀 **Disparo Instantâneo**: Suporte nativo a `FullScreenIntent` e permissões de sobreposição no Android 10+.
          
          **Download direto abaixo:** 👇
        draft: false
        prerelease: false
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
