name: Build Android APK (Mobile & TV)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Download Official Gradle Wrapper JAR
      run: |
        cd android
        mkdir -p gradle/wrapper
        curl -s -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar || curl -s -L -o gradle/wrapper/gradle-wrapper.jar https://repo.gradle.org/artifactory/libs-releases/org/gradle/gradle-wrapper/8.6/gradle-wrapper-8.6.jar
        chmod +x gradlew

    - name: Build Debug APK with Gradle Wrapper
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace --info

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ServONVIF-Android-Debug-APK
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: success()
      continue-on-error: true
      with:
        tag_name: v1.0.0
        name: ServONVIF Android TV & Mobile APK
        draft: false
        prerelease: false
        files: android/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
