name: Build & Release Android APK (Universal Mobile & TV)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Build Universal APK
      run: |
        cd android
        gradle assembleDebug --no-daemon

    - name: Upload APK to Workflow Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ServONVIF-Universal-APK
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.1
        name: "ServONVIF Universal v1.1.1 (Smartphone Android 14+ & Smart TV)"
        body: |
          ### 🛡️ ServONVIF Universal v1.1.1 (APK Oficial)
          
          Esta versão universal traz compatibilidade total com **Smartphones Android (Moto G56, Samsung, Xiaomi)**, **Tablets** e **Smart TVs / TV Boxes**:
          
          - 📱 **Compatibilidade Universal com Smartphones (Android 14/15+)**: Instalação e execução 100% livres de erros no Moto G56 e aparelhos recentes.
          - 📳 **Alertas Hápticos (Vibração) & Notificações Heads-Up**: Alertas vibratórios em tempo real no celular quando houver movimento ou leitura de placa (LPR).
          - 📺 **Central Smart TV 4K / D-Pad**: Navegação suave por controle remoto com anéis de foco iluminados e mosaico multitelas nativo.
          - 🔲 **Toolbar Responsiva**: Grade, Patrulha, Ajuste de Proporção (Cover/Contain), OSD e Modo Nativo/Web adaptáveis para qualquer tamanho de tela.
          - 🚀 **Assinatura V1 + V2 + V3**: Pacote APK pré-assinado e verificado para instalação direta em qualquer dispositivo Android (API 26+).
          
          **Download direto do APK abaixo:** 👇
        draft: false
        prerelease: false
        files: android/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


