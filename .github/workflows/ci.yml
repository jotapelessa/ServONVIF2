name: ServONVIF CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  engine-tests:
    name: Core Engine Tests (Python)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libgl1

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r engine/requirements.txt
        pip install pytest pytest-asyncio

    - name: Run Pytest Test Suite
      run: |
        pytest engine/tests

  ui-build:
    name: Next.js Static UI Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'ui/package.json'

    - name: Install UI Dependencies
      run: |
        cd ui
        npm ci || npm install

    - name: Build Next.js Static Export
      run: |
        cd ui
        npm run build

  docker-build:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    needs: [engine-tests, ui-build]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile
        push: false
        tags: servonvif-engine:latest
