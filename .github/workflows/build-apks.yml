name: Build and Release ServONVIF APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/build-apks.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APKs and Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build ServONVIF TV APK
        run: |
          mkdir -p build-outputs
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          TV_APK="$(find app/build/outputs/apk -name '*.apk' | head -n 1)"
          cp "$TV_APK" ../build-outputs/ServONVIF_TV_v2.1.0.apk

      - name: Build ServONVIF Mobile APK
        run: |
          cd mobile
          npm install
          npx expo prebuild --platform android --clean --no-install
          cd ..
          python3 scripts/patch_mobile_gradle.py
          cd mobile/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          MOBILE_APK="$(find app/build/outputs/apk -name '*.apk' | head -n 1)"
          cp "$MOBILE_APK" ../../build-outputs/ServONVIF_Mobile_v1.0.0.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ServONVIF_APKs
          path: build-outputs/*.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.0
          name: "ServONVIF v2.1.0 - TV & Mobile Apps"
          body: |
            🚀 **Lançamento Oficial ServONVIF v2.1.0**
            
            ### 📦 Aplicativos Disponíveis:
            - 📺 **ServONVIF_TV_v2.1.0.apk**: Aplicativo para Smart TV / TV Box com PiP overlay e suporte a controle remoto D-pad.
            - 📱 **ServONVIF_Mobile_v1.0.0.apk**: Aplicativo para Smartphone com integração Tailscale, visualizador 5MP ao vivo e feed LPR de placas.
          files: |
            build-outputs/ServONVIF_TV_v2.1.0.apk
            build-outputs/ServONVIF_Mobile_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
