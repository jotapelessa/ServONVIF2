name: Build and Release ServONVIF APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/build-apks.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APKs and Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Sync 9-Digit Versioning System
        id: versioning
        run: |
          python3 scripts/sync_version.py
          source build-outputs/version.env
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Build ServONVIF TV APKs (Classic & Netflix Style)
        run: |
          mkdir -p build-outputs
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          
          # Copy TV Classic APK
          TV_CLASSIC_APK="$(find app/build/outputs/apk -name '*.apk' | head -n 1)"
          cp "$TV_CLASSIC_APK" ../build-outputs/ServONVIF_TV_Classic_v${{ env.APP_VERSION }}.apk
          cp "$TV_CLASSIC_APK" ../build-outputs/ServONVIF_TV_Classic.apk
          
          # Copy TV Netflix Style APK
          TV_NETFLIX_APK="$(find app-modern/build/outputs/apk -name '*.apk' | head -n 1)"
          cp "$TV_NETFLIX_APK" ../build-outputs/ServONVIF_TV_Netflix_v${{ env.APP_VERSION }}.apk
          cp "$TV_NETFLIX_APK" ../build-outputs/ServONVIF_TV_Netflix.apk
          
          echo "✅ Built TV Classic and TV Netflix APKs successfully"

      - name: Build ServONVIF Mobile APK (Expo SDK 54)
        run: |
          cd mobile
          npm install --legacy-peer-deps
          npx expo prebuild --platform android --clean --no-install
          cd ..
          python3 scripts/patch_mobile_gradle.py
          cd mobile/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          MOBILE_APK="$(find app/build/outputs/apk -name '*.apk' | head -n 1)"
          cp "$MOBILE_APK" ../../build-outputs/ServONVIF_Mobile_v${{ env.APP_VERSION }}.apk
          cp "$MOBILE_APK" ../../build-outputs/ServONVIF_Mobile.apk
          echo "✅ Built Mobile APK successfully"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ServONVIF_APKs
          path: build-outputs/*.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "ServONVIF v${{ env.APP_VERSION }} - TV Classic, TV Netflix & Mobile Apps"
          body: |
            🚀 **Lançamento Oficial ServONVIF v${{ env.APP_VERSION }}**
            
            ### 📦 Aplicativos Disponíveis para Download:
            - 📺 **ServONVIF_TV_Classic_v${{ env.APP_VERSION }}.apk**: Versão clássica e estável para Smart TV e TV Box com PiP overlay e navegação por controle remoto.
            - 🎬 **ServONVIF_TV_Netflix_v${{ env.APP_VERSION }}.apk**: Nova versão com UI/UX cinematográfica **Estilo Netflix** (Hero Billboard, trilhos de câmeras, foco D-pad glow), mantendo 100% das abas, Mosaico e PiP.
            - 📱 **ServONVIF_Mobile_v${{ env.APP_VERSION }}.apk**: App standalone para Smartphones (Expo SDK 54 / React Native), com transmissão Zero-Flicker, cópia/compartilhamento de logs e suporte a Tailscale Funnel.
          files: |
            build-outputs/ServONVIF_TV_Classic_v${{ env.APP_VERSION }}.apk
            build-outputs/ServONVIF_TV_Netflix_v${{ env.APP_VERSION }}.apk
            build-outputs/ServONVIF_Mobile_v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

