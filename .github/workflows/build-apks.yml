name: Build ServONVIF APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/build-apks.yml'

jobs:
  build-tv-apk:
    name: Build ServONVIF TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build TV APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload ServONVIF TV APK
        uses: actions/upload-artifact@v4
        with:
          name: ServONVIF_TV_APK
          path: |
            android/app/build/outputs/apk/debug/ServONVIF_TV.apk
            android/app/build/outputs/apk/debug/app-debug.apk

  build-mobile-apk:
    name: Build ServONVIF Mobile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Expo Prebuild & Build APK
        run: |
          cd mobile
          npx expo prebuild --platform android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          mkdir -p ../../build-outputs
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../../build-outputs/ServONVIF_Mobile.apk \;

      - name: Upload ServONVIF Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: ServONVIF_Mobile_APK
          path: build-outputs/ServONVIF_Mobile.apk
