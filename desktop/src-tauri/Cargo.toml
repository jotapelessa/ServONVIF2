[package]
name = "servonvif-desktop"
version = "1.0.0"
description = "ServONVIF Desktop Client & Core Launcher"
authors = ["ServONVIF Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
